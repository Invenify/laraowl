name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # ✅ Checkout avec version récente (Node.js 24)
    - uses: actions/checkout@v5

    # ✅ Login à GitHub Container Registry
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # ✅ Configure Buildx with a container driver to support GHA cache export
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # ✅ Build avec le bon chemin Dockerfile (dans docker/)
    - name: Build the Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./docker/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ghcr.io/invenify/laraowl:${{ github.sha }}
          ghcr.io/invenify/laraowl:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # ✅ Debug en cas d'échec
    - name: Debug on failure
      if: failure()
      run: |
        echo "Build failed. Checking files..."
        ls -la
        ls -la docker/ 2>/dev/null || echo "docker/ directory not found"
        cat docker/Dockerfile 2>/dev/null || echo "Dockerfile not found in docker/"
